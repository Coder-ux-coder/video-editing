[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cutroom"
version = "0.1.0"
description = "Agent-native, non-destructive video editing pipeline (working name)."
readme = "README.md"
# Python 3.12 is the target: it has wheels for every planned dependency
# (faster-whisper/CTranslate2, onnxruntime, MediaPipe, OpenCV, torch).
requires-python = ">=3.12,<3.13"
classifiers = ["Private :: Do Not Upload"]
# Direct dependencies are pinned exactly. Transitive pins live in
# requirements.lock (generated by scripts/lock.sh) and are what setup installs.
dependencies = [
    "faster-whisper==1.2.1",
    # av 17+ removed open(metadata_errors=...), which faster-whisper 1.2.1 still passes.
    "av==16.1.0",
    "typer==0.28.0",
    "rich==15.0.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "psutil==7.2.2",
    # Sample-accurate audio reading/writing (bundles libsndfile, LGPL, dynamically linked).
    "soundfile==0.14.0",
    # Face detection (YuNet), sharpness and exposure measurement, contact sheets.
    "opencv-python-headless==5.0.0.93",
    # Interchange with Resolve/Premiere/Final Cut (OTIO export, re-read to verify). Apache-2.0.
    "opentimelineio==0.17.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# Speaker detection; install with requirements-speakers.txt (CPU-only PyTorch index).
speakers = ["pyannote.audio==4.0.7", "torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.0"]

[project.scripts]
cutroom = "cutroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutroom = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a downloaded ASR model or does real transcription",
]
addopts = "-ra"
