# Cutroom default style: professional defaults from docs/EDITING_STANDARDS.md.
# Client styles (styles/clients/<client>.style.yaml) override any key; only list what differs.
# Every number here is used by a tool; the comment says which and why.

name: default
description: Clean, modern YouTube talking-head style. Tight but not breathless.

editing:
  # remove-silence: pauses longer than this are shortened (seconds).
  max_pause: 0.50
  # Pause kept where a long pause is shortened. Within a sentence vs after a sentence end.
  keep_pause_mid_sentence: 0.18
  keep_pause_sentence_end: 0.32
  # Padding kept around speech at each cut, so consonants and decays are not clipped.
  pad_before_word: 0.06
  pad_after_word: 0.10
  # A pause after a sentence end that is longer than this AND followed by a short punchy
  # sentence is treated as a possible dramatic pause and kept at this length (seconds).
  dramatic_pause_keep: 0.55
  dramatic_pause_min: 0.9
  # Leading/trailing non-speech kept at the very start/end of the edit.
  head_pad: 0.15
  tail_pad: 0.40
  # Fillers: always removed (pure hesitation sounds).
  fillers_always: [um, umm, uh, uhh, uhm, er, erm, ah, ahh, hmm, mm, mhm]
  # Discourse markers: removed only when isolated by punctuation/pauses (see remove-fillers).
  fillers_contextual: [like, "you know", "i mean", basically, actually, literally, "kind of", "sort of", so, right, okay]
  remove_contextual_fillers: false     # conservative by default; agent may enable per job
  # Untranscribed voiced sounds in pauses (likely "um"/"uh" Whisper did not write down).
  remove_acoustic_fillers: true
  acoustic_filler_min: 0.15
  acoustic_filler_max: 1.2
  # Retakes: keep the last complete take of a repeated sentence.
  retake_window_s: 30.0
  retake_min_similarity: 0.6
  # Never leave clips shorter than this (orphaned fragments); merge or drop them.
  min_clip: 0.40
  # Click-free joins: fade length at every audio join (seconds, each side).
  join_fade: 0.008

pacing:
  # Long-form talking head: a visual change (cut, punch-in, graphic, b-roll) every 3-6 s on average.
  visual_change_target_s: [3.0, 6.0]
  max_static_s: 12.0
  hook_window_s: [3.0, 8.0]

audio:
  target_lufs: -14.0
  true_peak_dbtp: -1.0

output:
  long_form:
    width: 1920
    height: 1080
    fps: source        # keep the source frame rate
  preview:
    short_side: 540
    timecode: true

captions:
  # Which style `cutroom captions` uses when none is given.
  default_style: clean
  # Readability rules (docs/EDITING_STANDARDS.md §6). Phrases break at sentence ends, commas
  # and pauses, never after an article/preposition; at most this many lines per caption.
  max_lines: 2
  max_chars_per_line: 42        # long-form; Shorts use max_chars_per_line_short
  max_chars_per_line_short: 18
  max_cps: 17                   # reading-speed target (characters/second); reported if exceeded
  hard_max_cps: 20
  min_duration: 1.0             # a caption stays at least this long (if the next one allows)
  max_duration: 6.0
  linger: 0.4                   # caption stays this long after its last word, if there is a pause
  break_on_pause: 0.35          # a pause this long always starts a new caption
  lead_frames: 0                # show captions this many frames before the first word
  emphasis: true                # at most one emphasised word per caption (numbers, stressed words)
  # Text must stay inside these boxes (fractions of the frame). Long-form keeps clear of the
  # player's progress bar; Shorts keep clear of the right action column and the bottom UI.
  safe_zones:
    youtube_long: {left: 0.10, right: 0.90, top: 0.08, bottom: 0.90}
    youtube_short: {left: 0.08, right: 0.81, top: 0.14, bottom: 0.70}
  # Background brightness (WCAG relative luminance, 75th percentile of the caption area)
  # above which a style without outline or box gets an automatic scrim for contrast.
  scrim_threshold: 0.18
  styles:
    clean:
      description: White sentence-case text on a soft dark box. Calm, corporate, documentary.
      fontFamily: Inter
      fontWeight: 600
      fontSizeRel: 0.046          # x min(width, height): 50 px at 1080p
      color: "#FFFFFF"
      box: {color: "rgba(0,0,0,0.58)", radiusRel: 0.18, padXRel: 0.36, padYRel: 0.10, gap: 6}
      entrance: fade
      inFrames: 3
      outFrames: 3
      karaoke: false
      max_words: 12
      lines: 2
    bold-karaoke:
      description: Big uppercase words, thick outline, the spoken word lights up and pops. Energetic, Shorts-native.
      fontFamily: Montserrat
      fontWeight: 800
      fontSizeRel: 0.066
      uppercase: true
      color: "#FFFFFF"
      activeColor: "#FFD60A"
      emphasisColor: "#FFD60A"
      emphasisScale: 1.0
      strokeWidthRel: 0.13         # x font size
      strokeColor: "#000000"
      shadow: "0 6px 18px rgba(0,0,0,0.45)"
      karaoke: true
      wordPop: 0.12
      wordPopFrames: 6
      entrance: pop
      inFrames: 4
      outFrames: 2
      max_words: 4
      lines: 1
    word-highlight:
      description: Clean bold text; a coloured highlight box moves under each spoken word.
      fontFamily: Inter
      fontWeight: 800
      fontSizeRel: 0.054
      color: "#FFFFFF"
      activeBox: "#6D28D9"
      shadow: "0 3px 10px rgba(0,0,0,0.55)"
      karaoke: true
      entrance: rise
      inFrames: 5
      outFrames: 3
      max_words: 7
      lines: 2
    minimal:
      description: Small, quiet text low in frame, no animation. For interviews where captions should recede.
      fontFamily: Inter
      fontWeight: 500
      fontSizeRel: 0.038
      color: "#F5F5F5"
      shadow: "0 2px 6px rgba(0,0,0,0.7)"
      entrance: none
      karaoke: false
      max_words: 14
      lines: 2
